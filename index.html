<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Road - BETLOVER24</title>
    <style>
        /* 🐔 CHICKEN ROAD MASTER DESIGN THEME */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #161616; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        
        #viewport { position: relative; width: 100%; max-width: 400px; flex-grow: 1; background: #181818; overflow: hidden; border-left: 1px solid #222; border-right: 1px solid #222; }
        #game-world { position: absolute; display: flex; top: 0; left: 0; height: 100%; }
        .column { width: 70px; height: 100%; border-right: 1px dashed #1e5631; position: relative; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b3318; }
        .first-col { background-color: #202020; border-right: 1px solid #333; }
        .manhole { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, #2a2a2a 30%, #161616 100%); border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #888; }
        
        #chicken-group { position: absolute; width: 70px; height: 60px; z-index: 10; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        #chicken-img { width: 42px; height: 42px; object-fit: contain; z-index: 2; }
        #chicken-shadow { position: absolute; bottom: 2px; width: 30px; height: 8px; background: rgba(0,0,0,0.4); border-radius: 50%; z-index: 1; }
        
        #float-badge { position: absolute; top: -35px; background: #27ae60; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 5; }
        .barrier { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 50; }
        .ambient-car, .car { position: absolute; width: 45px; height: 85px; object-fit: contain; transform: rotate(180deg); z-index: 3; }
        
        #controls { width: 100%; max-width: 400px; background: #111; padding: 15px; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .diff-row, .input-group, .shortcuts, .actions { display: flex; gap: 8px; width: 100%; }
        .diff-btn, .ctrl-btn, .short-btn, .btn-go, .btn-cashout { border: none; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; }
        
        .diff-btn { flex: 1; padding: 8px; background: #222; color: #aaa; border-radius: 6px; font-size: 12px; border: 1px solid #333; }
        .diff-btn.active { background: #e74c3c; color: white; border-color: #e74c3c; }
        .input-group { background: #1b1b1b; border-radius: 8px; padding: 4px; align-items: center; border: 1px solid #222; }
        .ctrl-btn { width: 40px; height: 40px; background: #2a2a2a; color: white; font-size: 20px; border-radius: 6px; }
        .bet-display { flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: #fff; }
        
        .short-btn { flex: 1; padding: 8px 0; background: #222; color: #ccc; border-radius: 4px; font-size: 11px; border: 1px solid #2b2b2b; }
        .btn-go { flex: 1.3; padding: 14px; background: #2ecc71; color: white; font-size: 16px; border-radius: 8px; box-shadow: 0 4px #1e7e43; }
        .btn-go:active:not(.btn-disabled) { transform: translateY(3px); box-shadow: 0 1px #1e7e43; }
        
        .btn-cashout { flex: 1; padding: 14px; background: #f1c40f; color: #111; font-size: 13px; border-radius: 8px; box-shadow: 0 4px #b7950b; text-align: center; line-height: 1.2; }
        .btn-cashout:active:not(.btn-disabled) { transform: translateY(3px); box-shadow: 0 1px #b7950b; }
        .btn-disabled { opacity: 0.4; pointer-events: none; box-shadow: none !important; transform: none !important; }
    </style>
</head>
<body>

    <!-- 🎮 গেম ভিউপোর্ট এরিয়া -->
    <div id="viewport">
        <div id="game-world">
            <div id="chicken-group">
                <div id="barrier" class="barrier"></div>
                <img id="chicken-img" src="./chicken.png" alt="Chicken">
                <div id="chicken-shadow"></div>
                <div id="float-badge">1.00X</div>
            </div>
        </div>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া -->
    <div id="controls">
        <div class="diff-row">
            <button class="diff-btn active" id="btn-medium" onclick="setDifficulty('medium')">MEDIUM</button>
            <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">HARD</button>
        </div>

        <div class="input-group">
            <button class="ctrl-btn" onclick="updateBet('minus')">-</button>
            <div class="bet-display">৳ <span id="bet-val">10</span></div>
            <button class="ctrl-btn" onclick="updateBet('plus')">+</button>
        </div>

        <div class="shortcuts">
            <button class="short-btn" onclick="updateBet('min')">MIN</button>
            <button class="short-btn" onclick="updateBet('half')">1/2</button>
            <button class="short-btn" onclick="updateBet('double')">X2</button>
            <button class="short-btn" onclick="updateBet('max')">MAX</button>
        </div>

        <div class="actions">
            <button id="btn-cashout" class="btn-cashout btn-disabled" disabled>
                CASH OUT <br><span id="cash-val">৳ 0</span>
            </button>
            <button id="btn-go" class="btn-go" onclick="handleGo()">GO</button>
        </div>
    </div>

    <!-- 🔌 গ্লোবাল ক্লাউড সিঙ্ক জাভাস্ক্রিপ্ট মাস্টার ইঞ্জিন -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const CHICKEN_SERVER_URL = window.location.origin;

        // 🎯 [লাইভ সিকিউরিটি ইঞ্জিন]: ব্যালেন্স চেক বাইপাস লক (টাকা রেন্ডার ডাটাবেজ থেকেই একুরেট চেক হবে ভাই)
        let balance = 9999999; 
        let currentBet = 10;
        const MIN_BET = 1;
        const MAX_BET = 20000;

        let currentStep = 0;
        let currentMultiplier = 1.00;
        let difficulty = 'medium';
        let isGameActive = false;
        let isGameOver = false;
        let isWaiting = false;
        let crashInterval = null;

        const sounds = {
            click: new Audio('click.mp3'),
            jump: new Audio('jump.mp3'),
            safe: new Audio('safe.mp3'),
            crash: new Audio('crash.mp3'),
            win: new Audio('win.mp3')
        };

        const world = document.getElementById("game-world");
        const chickenGroup = document.getElementById("chicken-group");
        const badge = document.getElementById("float-badge");
        const barrier = document.getElementById("barrier");
        const btnGo = document.getElementById("btn-go");
        const btnCash = document.getElementById("btn-cashout");
        const cashVal = document.getElementById("cash-val");
        const betValDisplay = document.getElementById("bet-val");

        // সকেট ব্যালেন্স আপডেট লিসেনার লক
        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    // ব্যালেন্স লোকাল ভেরিয়েবল সবসময় এপিআই কাটিং সেফ মোডে থাকবে ভাই
                    balance = 9999999; 
                }
            });
        }
                async function loadLiveBalance() {
            try {
                const response = await fetch(`${CHICKEN_SERVER_URL}/api/chicken-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = 9999999;
                    
                    // 🎰 [এভিয়েটর ২.০ ওরিজিনাল ব্যালেন্স ফ্লাশার]: ডাটা আসার ১ মিলি-সেকেন্ডে মেইন ওয়ালেটে সিগন্যাল ফায়ার ভাই
                    if (window.parent) {
                        window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    }
                }
            } catch (e) {
                console.error("Balance loading error:", e);
            }
        }

        window.onload = () => {
            // 🎰 গেম লোড হওয়ার সময়ও এভিয়েটর প্রোটোকল সচল লক ভাই
            if (window.parent) {
                window.parent.postMessage({ action: "refresh_wallet" }, "*");
            }
            loadLiveBalance();
            initWorld();
        };


        setInterval(() => {
            if (isGameOver) return;
            let startRange = Math.max(1, currentStep + 2);
            let endRange = currentStep + 6;
            let randomCol = Math.floor(Math.random() * (endRange - startRange + 1)) + startRange;
            if (activeColsCount(randomCol)) {
                spawnAmbientCar(randomCol);
            }
        }, 800);

        function activeColsCount(colIndex) {
            const cols = document.querySelectorAll('.column');
            return cols && cols[colIndex];
        }

        function spawnAmbientCar(colIndex) {
            const cols = document.querySelectorAll('.column');
            if (!cols[colIndex]) return;
            const car = document.createElement("img");
            const carId = Math.floor(Math.random() * 3) + 1;
            car.src = `car${carId}.png`;
            car.className = "ambient-car";
            cols[colIndex].appendChild(car);
            let topPos = -120;
            let speed = 12 + Math.random() * 5;
            let interval = setInterval(() => {
                topPos += speed;
                car.style.top = topPos + "px";
                if (topPos > 600) {
                    car.remove();
                    clearInterval(interval);
                }
            }, 20);
        }
        function setDifficulty(mode) {
            if (isGameActive) return;
            sounds.click.cloneNode(true).play();
            difficulty = mode;
            document.getElementById('btn-medium').className = mode === 'medium' ? 'diff-btn active' : 'diff-btn';
            document.getElementById('btn-hard').className = mode === 'hard' ? 'diff-btn active' : 'diff-btn';
            initWorld();
        }

        function initWorld() {
            const existingCols = document.querySelectorAll('.column');
            existingCols.forEach(col => col.remove());

            const firstCol = document.createElement("div");
            firstCol.className = "column first-col";
            world.insertBefore(firstCol, chickenGroup);

            let rate = difficulty === 'hard' ? 0.18 : 0.12;
            for (let i = 1; i <= 100; i++) {
                const col = document.createElement("div");
                col.className = "column";
                let val = (1 + (i * rate)).toFixed(2);
                col.innerHTML = `<div class="manhole">${val}X</div>`;
                world.appendChild(col);
            }

            world.style.transform = 'translateX(0px)';
            chickenGroup.style.left = "0px";
            chickenGroup.style.top = "50%";
            chickenGroup.style.transform = 'translateY(-50%)';

            badge.innerText = "1.00X";
            badge.style.background = "#27ae60";
            barrier.style.display = "none";
        }

        function updateBet(action) {
            if (isGameActive) return;
            sounds.click.cloneNode(true).play();

            if (action === 'minus') currentBet -= 10;
            else if (action === 'plus') currentBet += 10;
            else if (action === 'min') currentBet = MIN_BET;
            else if (action === 'half') currentBet = Math.floor(currentBet / 2);
            else if (action === 'double') currentBet *= 2;
            else if (action === 'max') currentBet = MAX_BET;

            if (currentBet < MIN_BET) currentBet = MIN_BET;
            if (currentBet > MAX_BET) currentBet = MAX_BET;
            betValDisplay.innerText = currentBet;
        }

        async function handleGo() {
            if (isGameOver) { resetGame(); return; }

            if (isWaiting) {
                const activeCols = document.querySelectorAll('.column');
                if (activeCols[currentStep]) {
                    const mainCar = activeCols[currentStep].querySelector('.car:not(.ambient-car)');
                    if (mainCar) mainCar.remove();
                }
                barrier.style.display = "none";
                isWaiting = false;
                return;
            }

            if (!isGameActive) {
                try {
                    // 🎲 সরাসরি এক্সপ্রেস নোড সার্ভারে হিট লক ভাই
                    const response = await fetch(`${CHICKEN_SERVER_URL}/api/chicken-bet`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: urlUserId,
                            amount: parseFloat(currentBet),
                            wallet: urlWallet
                        })
                    });
                                    const data = await response.json();
                if (data && data.success) {
                    sounds.click.play();
                    isGameActive = true;
                    
                    if (data.balance !== undefined) {
                        balance = parseFloat(data.balance);
                    }
                    
                    if (window.parent) {
                        window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    }
                    
                    // 🎰 [আল্ট্রা-বুস্টেড ডাইরেক্ট ওয়ালেট ফ্লাশার] ঠিক এখানে এসে সুন্দর বসে লক হয়ে গেল ভাই!
                    if (window.parent && window.parent.document) {
                        const parentWalletSelect = window.parent.document.getElementById("active_wallet");
                        if (parentWalletSelect && data.balance !== undefined) {
                            const mainOption = parentWalletSelect.querySelector("option[value='main']");
                            if (mainOption) {
                                let formattedBal = parseFloat(data.balance).toLocaleString('en-IN', {minimumFractionDigits: 2});
                                mainOption.text = "Main: ৳" + formattedBal;
                            }
                        }
                    }

                    btnCash.classList.remove("btn-disabled");
                    btnCash.disabled = false;
    
                    btnGo.disabled = true;
                    btnGo.classList.add("btn-disabled");
                } else {
                    alert(data.message || "❌ Balance deduction failed!");
                    return;
                }
            } catch (err) {
                console.error(err);
                alert("⚠️ কানেকশন এরর! আবার চেষ্টা করুন।");
                return;
            }
        }

        moveChicken();
    }
                            

        function moveChicken() {
            currentStep++;
            sounds.jump.play();

            let offset = (currentStep * 70);
            world.style.transform = `translateX(-${offset}px)`;
            chickenGroup.style.left = offset + "px";

            let crashChance = difficulty === 'hard' ? 0.25 : 0.10;
            let isSafe = Math.random() > crashChance;

            setTimeout(() => {
                spawnCar(currentStep, isSafe);
            }, 300);
        }

        function spawnCar(step, isSafe) {
            const cols = document.querySelectorAll('.column');
            const targetCol = cols[step];
            if (!targetCol) return;

            const car = document.createElement("img");
            const carId = Math.floor(Math.random() * 3) + 1;
            car.src = `car${carId}.png`;
            car.className = "car";
            targetCol.appendChild(car);

            let topPos = -120;
            let speed = difficulty === 'hard' ? 18 : 15;
            let stopPoint = 30;

            let interval = setInterval(() => {
                if (isGameOver && !isSafe) { }
                else if (isGameOver) { clearInterval(interval); return; }

                if (isSafe && topPos >= stopPoint) {
                    clearInterval(interval);
                    isWaiting = true;
                    btnGo.disabled = false;
                    btnGo.classList.remove("btn-disabled");
                    updateWin();
                    return;
                }

                topPos += speed;
                car.style.top = topPos + "px";

                if (!isSafe && topPos > 140) {
                    triggerCrash(car);
                    clearInterval(interval);
                }
            }, 20);
        }

        function updateWin() {
            let rate = difficulty === 'hard' ? 0.18 : 0.12;
            currentMultiplier = (1 + (currentStep * rate)).toFixed(2);
            badge.innerText = currentMultiplier + "X";
            let winAmount = Math.floor(currentBet * currentMultiplier);
            cashVal.innerText = "৳ " + winAmount;
        }

        function triggerCrash(car) {
            isGameOver = true;
            isGameActive = false;
            sounds.crash.play();
            badge.style.background = "#e74c3c";
            badge.innerText = "CRASH";

            btnGo.innerText = "TRY AGAIN";
            btnGo.style.background = "#e74c3c";
            btnGo.disabled = false;
            btnGo.classList.remove("btn-disabled");

            btnCash.classList.add("btn-disabled");
            btnCash.disabled = true;
            barrier.style.display = "none";

            let crashFall = 0;
            if (crashInterval) clearInterval(crashInterval);
            crashInterval = setInterval(() => {
                crashFall += 12;
                car.style.top = (140 + crashFall) + "px";
                chickenGroup.style.top = (50 + (crashFall / 3.5)) + "%";
                if (crashFall > 600) {
                    car.remove();
                    clearInterval(crashInterval);
                }
            }, 20);
        }

        async function cashOut() {
            if (!isGameActive || isGameOver) return;
            sounds.win.play();
            let rate = difficulty === 'hard' ? 0.18 : 0.12;
            currentMultiplier = (1 + (currentStep * rate)).toFixed(2);
            const totalWinAmount = parseFloat((currentBet * currentMultiplier).toFixed(2));

            try {
                const response = await fetch(`${CHICKEN_SERVER_URL}/api/chicken-win`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: totalWinAmount,
                        bet_amount: parseFloat(currentBet),
                        multiplier: parseFloat(currentMultiplier),
                        wallet: urlWallet
                    })
                });

                         const data = await response.json();
            if (data && data.success) {
                alert(`🎯 Cashout Success! You Won ৳${totalWinAmount}`);
                isGameActive = false;

                // 🎰 [এভিয়েটর ওরিজিনাল ক্যাশআউট ফ্লাশার]: উইন হওয়ার সাথে সাথে মেইন হেডার ওয়ালেট লাইভ রিফ্রেশ করবে ভাই!
                if (window.parent) {
                    window.parent.postMessage({ action: "refresh_wallet" }, "*");
                }

                resetGame();
            }
   
            } catch (err) {
                console.error(err);
                alert("⚠️ ক্যাশআউট এরর!");
            }
        }

        if (btnCash) {
            btnCash.onclick = cashOut;
        }

        function resetGame() {
            if (crashInterval) clearInterval(crashInterval);
            sounds.click.play();
            
            isGameOver = false;
            isGameActive = false;
            isWaiting = false;
            currentStep = 0;
            currentMultiplier = 1.00;
            
            btnGo.innerText = "GO";
            btnGo.style.background = "#2ecc71";
            btnGo.disabled = false;
            btnGo.classList.remove("btn-disabled");
            
            btnCash.classList.add("btn-disabled");
            btnCash.disabled = true;
            cashVal.innerText = "৳ 0";
            
            badge.innerText = "1.00X";
            badge.style.background = "#27ae60";
            
            chickenGroup.style.transition = 'none';
            chickenGroup.style.top = "50%";
            chickenGroup.style.left = "0px";
            chickenGroup.style.transform = "translateY(-50%)";
            
            document.querySelectorAll('.car').forEach(c => c.remove());
            document.querySelectorAll('.ambient-car').forEach(c => c.remove());
            
            initWorld();
            loadLiveBalance();
            
            setTimeout(() => {
                chickenGroup.style.transition = 'left 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            }, 50);
        }
    </script>
</body>
</html>
